services:
  resender:
    build: .
    # Or pull a prebuilt image instead of building:
    # image: ghcr.io/allenpilares/resender:latest
    container_name: resender
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      # SQLite database and the generated session secret live here.
      - ./data:/data
    environment:
      # Public URL used to render endpoint URLs and copy-paste snippets in the UI.
      # Change to your real domain, e.g. "https://forms.example.com".
      BASE_URL: "http://localhost:3000"
      #
      # --- Recommended: change the admin password from the default "admin" ---
      # ADMIN_PASSWORD: "change-me-please"
      #
      # Set to "true" when running behind nginx/Caddy so client IPs (used for
      # rate limiting and logs) are read from X-Forwarded-For.
      # TRUST_PROXY: "true"
      #
      # Optional, strongly recommended spam protection. Configure a Turnstile
      # widget for the websites that host your forms. Set both values together
      # in .env; empty defaults leave the feature disabled.
      TRANSACTIONAL_API_KEY_SHA256: "${TRANSACTIONAL_API_KEY_SHA256:-}"
      TRANSACTIONAL_DAILY_LIMIT: "${TRANSACTIONAL_DAILY_LIMIT:-100}"
      TURNSTILE_SITE_KEY: "${TURNSTILE_SITE_KEY:-}"
      TURNSTILE_SECRET_KEY: "${TURNSTILE_SECRET_KEY:-}"
      #
      # Optional overrides (sensible defaults shown):
      # PORT: "3000"
      # DATA_DIR: "/data"
      # SESSION_SECRET: ""   # auto-generated and persisted to /data/secret if unset
